<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enter Your Name</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; text-align: center; }
        input { padding: 10px; font-size: 16px; width: 70%; margin: 10px 0; }
        button { padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        h1 { color: #2E7D32; }
    </style>
    <script>
        // Restrict username to letters/numbers only
        function validateUsername(input) {
            const regex = /^[a-zA-Z0-9]+$/;
            if (!regex.test(input.value)) {
                alert("Username can only contain letters and numbers!");
                input.value = input.value.replace(/[^a-zA-Z0-9]/g, '');
            }
        }
    </script>
</head>
<body>
    <h1>Hi there! 👋</h1>
    <p>Enter your name to start the {{ module_title }} quiz:</p>

    <form action="/quiz" method="get">
        <input type="hidden" name="module_id" value="{{ module_id }}">
        <input
            type="text"
            name="username"
            required
            placeholder="e.g., Lily123"
            oninput="validateUsername(this)"
            minlength="2"
            maxlength="20"
        >
        <br>
        <button type="submit">Start Quiz!</button>
    </form>
</body>
</html>
